ss="check"><input type="checkbox" required> 投稿ガイドラインと、画像の権利・個人情報に関する確認事項に同意します</label><button class="button primary full">投稿する</button></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="/iimono-site/assets/app.js?v=20260830-54"></script><script src="/iimono-site/assets/article-editor.js?v=20260830-54"></script> </body></html>
